name: Build Windows MSIX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx electron-builder --win msix

      - uses: actions/upload-artifact@v4
        with:
          name: NeuralTower-MSIX
          path: dist/*
